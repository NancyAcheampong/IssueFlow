services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: issueflow
      POSTGRES_PASSWORD: issueflow
      POSTGRES_DB: issueflow
    ports:
      - "5432:5432"
    volumes:
      - issueflow_postgres_data:/var/lib/postgresql/data

volumes:
  issueflow_postgres_data:
